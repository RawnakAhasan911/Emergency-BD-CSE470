<!DOCTYPE html>
<html lang="en" class="bg-black">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- You can replace the href below with a path to your own custom logo -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <title>Emergency BD - Citizen Incident Reporting</title>
    
    <!-- Optional: Adding a Google Font for that mono/cyber look if Tailwind's default mono isn't enough -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
      /* Fallback styles to prevent a white flash before Tailwind loads */
      body {
        background-color: #0a0a0a;
        color: #ffffff;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body class="antialiased">
    
    <!-- This is where your entire Vue application (App.vue) is injected -->
    <div id="app"></div>
    
    <!-- Vite injects your main JavaScript file here -->
    <script type="module" src="/src/main.js"></script>
    
  </body>
</html>
